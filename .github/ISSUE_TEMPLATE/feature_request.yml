name: Feature Request
description: Suggest a new feature or improvement for OctarqVault
labels: ["enhancement"]
body:
  - type: dropdown
    id: feature_area
    attributes:
      label: Feature Area
      options:
        - Sync
        - Encryption
        - UI
        - Asset Types
        - Import-Export
        - Notifications
        - Platform Support
        - Other
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered
    validations:
      required: false

  - type: checkboxes
    id: platform_relevance
    attributes:
      label: Platform Relevance
      options:
        - label: Android
        - label: iOS
        - label: macOS
        - label: Web
        - label: Windows
        - label: Linux
        - label: All

  - type: dropdown
    id: security_implications
    attributes:
      label: Security Implications
      description: Does this feature have security implications?
      options:
        - "No"
        - "Yes"
        - Unsure
    validations:
      required: true
